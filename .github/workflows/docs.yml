name: Documentation integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-only documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          for path in Path('.').rglob('*'):
              if '.git' in path.parts or not path.is_file():
                  continue
              if path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
              if path.suffix == '.md':
                  text=path.read_text(encoding='utf-8')
                  assert not re.search(r'(?<![A-Za-z])[A-Za-z]:[\\/]',text), path
                  for link in re.findall(r'\]\(([^)]+)\)',text):
                      if '://' not in link and not link.startswith('#'):
                          assert (path.parent/link.split('#')[0]).is_file(), (path,link)
          assert Path('LICENSE').is_file() and Path('AGENTS.md').is_file()
          print('Documentation UTF8, JSON and local links checked; no numerical execution.')
          PY
